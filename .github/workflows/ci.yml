name: Validación del ERP

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Código y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test:ci
      - name: Auditoría del esquema versionado (no de Neon)
        run: pnpm db:audit

  build:
    name: Compilación de producción
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_ENV: production
          # Solo se compila. Estas credenciales ficticias no conectan a Neon.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/agromonitor_ci
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/agromonitor_ci
          AUTH_SECRET: ci-build-only-not-for-deployment
      - name: Resultado
        run: |
          echo '### Compilación aprobada' >> "$GITHUB_STEP_SUMMARY"
          echo 'Este workflow valida código; no despliega ni modifica bases de datos.' >> "$GITHUB_STEP_SUMMARY"
          echo 'La URL de preview debe provenir de un despliegue real del proveedor de hosting.' >> "$GITHUB_STEP_SUMMARY"
